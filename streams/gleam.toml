name = "streams"
version = "1.0.0"

# Fill out these fields if you intend to generate HTML documentation or publish
# your project to the Hex package manager.
#
# description = ""
# licences = ["Apache-2.0"]
# repository = { type = "github", user = "", repo = "" }
# links = [{ title = "Website", href = "" }]
#
# For a full reference of all the available options, you can have a look at
# https://gleam.run/writing-gleam/gleam-toml/.

[dependencies]
gleam_stdlib = ">= 1.0.0 and < 2.0.0"
in = ">= 1.1.0 and < 2.0.0"
birch = ">= 0.2.1 and < 1.0.0"
gleam_erlang = ">= 1.3.0 and < 2.0.0"
gleam_time = ">= 1.10.0 and < 2.0.0"
shared = { path = "../shared" }
# INSERT validation (lang/dml_semantics) reads and writes a `Catalog` to
# check a stream's declared shape — `catalog.gleam` lives in schema/,
# next to the ddl_ast types it operates on, so streams depends on the
# whole schema package to reach it. See the note on `Catalog` in
# schema/src/lang/catalog.gleam.
schema = { path = "../schema" }

[dev_dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
