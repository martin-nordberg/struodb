name: docs

# Builds the VitePress site under documentation/docs and publishes it to
# GitHub Pages. Kept separate from test.yml since this needs pages/
# id-token permissions that the test workflow has no reason to hold.

on:
  push:
    branches:
      - main
    paths:
      - documentation/**
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v2
      - run: bun install
        working-directory: documentation
      - run: bun run docs:build
        working-directory: documentation
      - uses: actions/upload-pages-artifact@v3
        with:
          path: documentation/docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
