name: test

# A single, repo-root workflow — GitHub Actions only ever discovers
# workflows under .github/workflows/ at the repository root, so the
# previous one-file-per-package layout (domain/*/.github/workflows/
# test.yml, from when each package was its own repository) never
# actually ran once they became subdirectories of this monorepo. This
# replaces all five with one real workflow: a matrix job keeps each
# domain/* package's build/test/format-check independent of the others
# (the property the old layout was going for), plus one job for
# service/, which needs every domain/* package built first since its
# bridges import their compiled output, plus a matrix job for every
# services/* package (see
# documentation/plans/architecture/event-store-implementation-plan.md,
# Phase 14) — each independent of the others the same way domain/*'s own
# matrix is, and each gets its own `bun install` so its workspace
# dependencies (and, where needed, a domain/* build) are in place first.

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  domain:
    strategy:
      fail-fast: false
      matrix:
        package: [shared, schema, streams, network, projections]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v2
      - run: gleam deps download
        working-directory: domain/${{ matrix.package }}
      - run: gleam test --runtime bun
        working-directory: domain/${{ matrix.package }}
      - run: gleam format --check src test
        working-directory: domain/${{ matrix.package }}

  service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v2
      - run: bun install
      - run: bun run build:domain
      - run: bun run --cwd service build
      - run: bun run --cwd service test

  services:
    strategy:
      fail-fast: false
      matrix:
        package:
          [
            aggregator-registration,
            database-repo,
            event-collector-service,
            event-creation,
            event-delivery,
            event-obsolescence,
            event-store,
            hlc-clock,
            http-event-creation,
            schema-migration,
          ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v2
      - run: bun install
      - run: bun run --cwd services/${{ matrix.package }} build
      - run: bun run --cwd services/${{ matrix.package }} test
