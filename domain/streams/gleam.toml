name = "streams"
version = "1.0.0"
target = "javascript"

# Fill out these fields if you intend to generate HTML documentation or publish
# your project to the Hex package manager.
#
# description = ""
# licences = ["Apache-2.0"]
# repository = { type = "github", user = "", repo = "" }
# links = [{ title = "Website", href = "" }]
#
# For a full reference of all the available options, you can have a look at
# https://gleam.run/writing-gleam/gleam-toml/.

[dependencies]
gleam_stdlib = ">= 1.0.0 and < 2.0.0"
shared = { path = "../shared" }

[dev_dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
# Test-only: dml_semantics_test.gleam's worked-example test builds a
# realistic Catalog by running schema's own ddl_parser/ddl_semantics
# against spec.md's CREATE/ALTER STREAM examples, rather than hand-
# building one — production code (lang/dml_semantics.gleam) needs only
# lang/catalog, which lives in shared/, so this isn't a production
# dependency. See the note on `Catalog` in shared/src/lang/catalog.gleam.
schema = { path = "../schema" }
